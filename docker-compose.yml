services:
  langflow:
    image: langflowai/langflow:1.3.4   # pin a version
    container_name: langflow
    ports: ["7860:7860"]
    env_file: [langflow.env]
    volumes:
      # Mount ONLY your custom components (optional)
      - ./custom_components:/components:ro
      # (No mount to /app or /app/langflow!)
    networks: [langflow-network]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # /health is uvicorn-only and can pass before Langflow is ready.
      # Prefer /health_check for app readiness.
      test: ["CMD", "curl", "-f", "http://localhost:7860/health_check"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: langflow-postgres
    environment:
      - POSTGRES_DB=langflow
      - POSTGRES_USER=langflow
      - POSTGRES_PASSWORD=langflow123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [langflow-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langflow -d langflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: langflow-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks: [langflow-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  redis-data:

networks:
  langflow-network:
    driver: bridge
